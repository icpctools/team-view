<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Initialize dark mode class before page loads to prevent flash
			// mode-watcher uses 'mode-watcher-mode' as the localStorage key
			(function () {
				try {
					const stored = localStorage.getItem('mode-watcher-mode');
					const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					const shouldBeDark = stored === 'dark' || (!stored && prefersDark);

					if (shouldBeDark) {
						document.documentElement.classList.add('dark');
					} else {
						document.documentElement.classList.remove('dark');
					}
				} catch (err) {
					// Fallback if localStorage is not available
					console.warn(`Could not initialize dark mode: ${err}`);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
