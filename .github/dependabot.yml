version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      # check at 3am UTC
      time: "03:00"
    open-pull-requests-limit: 5
    groups:
      eslint:
        applies-to: version-updates
        patterns:
          - "eslint"
          - "@eslint/*"
      tailwindcss:
        applies-to: version-updates
        patterns:
          - "@tailwindcss/*"
          - "tailwindcss"
