name: PR check

on: [pull_request]

jobs:
  lint-format-build:
    name: lint, format, build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true

      - name: Run linter
        run: pnpm lint

      - name: Run formatter
        run: pnpm format

      - name: Run build
        run: pnpm build

      - name: Run Svelte check
        run: pnpm check

      - name: Run unit tests
        run: pnpm test:unit
