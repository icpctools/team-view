name: PR check

on: [pull_request]

jobs:
  lint-format-build:
    name: lint, format, build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run linter
        run: pnpm lint

      - name: Run formatter
        run: pnpm format

      - name: Run build
        run: pnpm build

      - name: Run Svelte check
        run: pnpm check

      - name: Run unit tests
        run: pnpm test:unit
