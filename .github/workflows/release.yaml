name: Release

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write
  repository-projects: write

# Every merge to main is tagged and released as a prerelease (e.g. 0.10.0-next.123), publishing the Docker
# image and npm packages under the 'next' tag. A manual run releases the given version the same way, but
# marks it as a full release ('latest') and bumps the version on main. Both live in this one workflow
# because npm trusted publishing is tied to a single workflow file.
on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (example: 0.1.0)'
        required: true
      branch:
        description: 'Branch to use for the release'
        required: true
        default: main

# Don't run prerelease publishes in parallel; if merges queue up, only the newest one is published
concurrency:
  group: ${{ github.event_name == 'push' && 'release-next' || github.run_id }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  REGISTRY: ghcr.io
  IMAGE_NAME: icpctools/team-view

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'push'

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            # e.g. 0.10.0-next -> 0.10.0-next.123
            BASE=$(node -p "require('./package.json').version.split('-')[0]")
            VERSION="${BASE}-next.${{ github.run_number }}"
            PUBLISH=true
          else
            VERSION="$INPUT_VERSION"
            PUBLISH=$([ "$INPUT_BRANCH" == "main" ] && echo true || echo false)
          fi
          PRERELEASE=$([[ "$VERSION" == *-* ]] && echo true || echo false)
          echo "Version: $VERSION, prerelease: $PRERELEASE, publish: $PUBLISH"
          echo "version=$VERSION" >> ${GITHUB_OUTPUT}
          echo "prerelease=$PRERELEASE" >> ${GITHUB_OUTPUT}
          echo "publish=$PUBLISH" >> ${GITHUB_OUTPUT}

  tag:
    name: Tag release
    runs-on: ubuntu-26.04
    needs: [version]
    timeout-minutes: 10
    outputs:
      githubTag: ${{ steps.tag_util.outputs.githubTag }}
      releaseVersion: ${{ steps.tag_util.outputs.releaseVersion }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}

      - name: Generate tags
        id: tag_util
        run: |
          TAG_PATTERN=${{ needs.version.outputs.version }}
          echo "githubTag=v$TAG_PATTERN" >> ${GITHUB_OUTPUT}
          echo "releaseVersion=$TAG_PATTERN" >> ${GITHUB_OUTPUT}

      - name: Tag the code
        run: |
          git config --local user.name ${{ github.actor }}
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          # Add the new version in package.json files
          sed -i  "s#version\":\ \"\(.*\)\",#version\":\ \"${{ steps.tag_util.outputs.releaseVersion }}\",#g" package.json
          find packages/* -maxdepth 1 -name "package.json" | xargs -I {} sed -i "s#version\":\ \"\(.*\)\",#version\":\ \"${{ steps.tag_util.outputs.releaseVersion }}\",#g" {}
          git add package.json packages/*/package.json

          # commit the changes
          git commit -m "chore: 🥁 tagging ${{ steps.tag_util.outputs.githubTag }} 🥳"
          echo "Tagging with ${{ steps.tag_util.outputs.githubTag }}"
          git tag ${{ steps.tag_util.outputs.githubTag }}
          git push origin ${{ steps.tag_util.outputs.githubTag }}

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.tag_util.outputs.githubTag }}
          name: ${{ steps.tag_util.outputs.githubTag }}
          draft: true
          prerelease: ${{ needs.version.outputs.prerelease }}

      - name: Create PR to bump the version (only if releasing from the main branch)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch == 'main' }}
        run: |
          git config --local user.name ${{ github.actor }}
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          CURRENT_VERSION=$(echo "${{ steps.tag_util.outputs.releaseVersion }}")
          tmp=${CURRENT_VERSION%.*}
          minor=${tmp#*.}
          bumpedVersion=${CURRENT_VERSION%%.*}.$((minor + 1)).0
          bumpedBranchName="bump-to-${bumpedVersion}"
          git checkout -b "${bumpedBranchName}"
          sed -i  "s#version\":\ \"\(.*\)\",#version\":\ \"${bumpedVersion}-next\",#g" package.json
          find packages/* -maxdepth 1 -name "package.json" | xargs -I {} sed -i "s#version\":\ \"\(.*\)\",#version\":\ \"${bumpedVersion}-next\",#g" {}
          git add package.json packages/*/package.json

          # commit the changes
          git commit -s --amend -m "chore: bump version to ${bumpedVersion}"
          git push origin "${bumpedBranchName}"
          echo -e "Bump version to ${bumpedVersion}\n\n${{ steps.tag_util.outputs.releaseVersion }} has been released.\n\n Time to switch to the new ${bumpedVersion} version" > /tmp/pr-title
          pullRequestUrl=$(gh pr create --title "chore: bump version to ${bumpedVersion}" --body-file /tmp/pr-title --head "${bumpedBranchName}" --base "main")
          echo "Pull request created: ${pullRequestUrl}"
          echo "Flag the PR as being ready for review"
          gh pr ready "${pullRequestUrl}"
          echo "Mark the PR as being ok to be merged automatically"
          gh pr merge "${pullRequestUrl}" --auto --rebase
          sed -i  "s#version\":\ \"\(.*\)\",#version\":\ \"${CURRENT_VERSION}\",#g" package.json
          find packages/* -maxdepth 1 -name "package.json" | xargs -I {} sed -i "s#version\":\ \"\(.*\)\",#version\":\ \"${CURRENT_VERSION}\",#g" {}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-publish:
    name: Build and publish
    runs-on: ubuntu-26.04
    needs: [version, tag]
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.tag.outputs.githubTag }}
          fetch-depth: 0

      - name: Log in to Container Registry
        if: needs.version.outputs.publish == 'true'
        uses: docker/login-action@v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=next,enable=${{ needs.version.outputs.prerelease == 'true' }}
            type=raw,value=${{ needs.version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.version.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm-publish:
    name: Publish npm packages
    runs-on: ubuntu-26.04
    needs: [version, tag]
    if: needs.version.outputs.publish == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.tag.outputs.githubTag }}

      - name: Install pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true

      - name: Build packages
        run: |
          pnpm install --frozen-lockfile
          pnpm build:packages

      # pnpm pack replaces workspace:* dependencies with the released version
      - name: Pack packages
        run: |
          mkdir packed
          (cd packages/contest-api && pnpm pack --pack-destination ../../packed)
          (cd packages/contest-ui && pnpm pack --pack-destination ../../packed)

      # Uses npm trusted publishing (OIDC) once it is configured for each package on npmjs.com. Until
      # then (i.e. the very first publish), set an NPM_TOKEN secret; delete it afterwards.
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          fi
          # npm requires a dist-tag for prerelease versions (e.g. 1.0.0-next.123), and they shouldn't become latest
          DIST_TAG=latest
          if [ "$PRERELEASE" == "true" ]; then
            DIST_TAG=next
          fi
          # contest-api first, since contest-ui depends on it. The ./ prefix is required, otherwise npm
          # treats 'packed/<file>' as a GitHub repository shorthand
          for pkg in ./packed/icpctools-contest-api-*.tgz ./packed/icpctools-contest-ui-*.tgz; do
            pnpm dlx npm@^11.5.1 publish "$pkg" --access public --tag "$DIST_TAG"
          done

  release:
    name: Release
    runs-on: ubuntu-26.04
    needs: [version, tag, build-publish]
    timeout-minutes: 5

    steps:
      # Prereleases are never marked as latest by GitHub, so this only moves 'latest' for full releases
      - name: Publish release
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.githubTag }}

  update-website:
    name: Update website
    runs-on: ubuntu-26.04
    # The website only lists published releases, and also shows the npm packages, so wait for both -
    # but still update the website for the new release if only the npm publish failed
    needs: [tag, release, npm-publish]
    if: always() && needs.release.result == 'success'
    timeout-minutes: 5

    steps:
      # Needs a token with write access to icpctools/icpctools.github.io; the website also rebuilds
      # every 6 hours, so it catches up if this fails
      - name: Trigger website rebuild
        run: gh api repos/icpctools/icpctools.github.io/dispatches -f event_type=release -f "client_payload[version]=$VERSION"
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          VERSION: ${{ needs.tag.outputs.releaseVersion }}

  cleanup:
    name: Clean up old prereleases
    runs-on: ubuntu-26.04
    needs: [release]
    timeout-minutes: 5

    steps:
      # The -next.<run_number> suffix increases across versions, so sort by it and keep the newest. Also
      # catches tags whose release was never created or published (e.g. because the build failed)
      - name: Delete old prerelease tags and releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP: 10
        run: |
          gh api --paginate "repos/$REPO/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' \
            | grep -E -- '-next\.[0-9]+$' \
            | awk -F'-next.' '{ print $NF " " $0 }' | sort -rn | cut -d' ' -f2 \
            | tail -n +$((KEEP + 1)) \
            | while read -r tag; do
                echo "Deleting $tag"
                gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes \
                  || gh api -X DELETE "repos/$REPO/git/refs/tags/$tag"
              done
